# .github/actions/set-commit-status/action.yml
name: 'Set Commit Status'
description: 'Sets the commit status for a given SHA'
inputs:
  sha:
    description: 'The commit SHA to update the status for'
    required: true
  status:
    description: 'The status to set (pending, success, failure, error)'
    default: ${{ job.status }}
  context:
    description: 'The context for the status check'
    default: '${{ github.workflow }} / ${{ github.job }} (${{ github.event.workflow_run.event }})'
  token:
    description: 'GitHub token'
    default: ${{ github.token }}
  target-url:
    description: 'Where the Details link should take the reviewer'
    default: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  description:
    description: 'Short status message (defaults to the status)'
runs:
  using: 'composite'
  steps:
    - name: Set commit status
      uses: myrotvorets/set-commit-status-action@v2.0.1
      with:
        sha: ${{ inputs.sha }}
        token: ${{ inputs.token }}
        status: ${{ inputs.status }}
        context: ${{ inputs.context }}
        description: ${{ inputs.description || inputs.status }}
        targetUrl: ${{ inputs.target-url }}
