name: Build

on: 
  push:
    branches:    
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/install-mkdocs.sh
            scripts/preview-requirements.txt
            plugins/mkdocs-git-committers-plugin-2/setup.py
      - name: Install mkdocs-material
        run: |
          scripts/install-mkdocs.sh
      - name: Cache GitHub users
        uses: actions/cache@v4
        with:
          path: authors.json
          # PRs can restore main's cache; each run saves newly discovered users.
          key: github-users-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-users-v1-
      - name: Restore the legacy main cache if needed
        if: hashFiles('authors.json') == ''
        uses: actions/cache/restore@v4
        with:
          path: authors.json
          key: test-push-github-users-v0.1
      - name: Test article preview publishing
        run: |
          python -m pip install -r scripts/preview-requirements.txt
          python -m unittest discover -s scripts -p 'test_*preview*.py'
      - name: Build pages
        env:
          MKDOCS_GIT_COMMITTERS_BRANCH: ${{ github.ref_name }}
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ github.token }}
          MKDOCS_ENABLE_GIT_REVISION_DATE: ${{ github.token && 'True' || 'False' }}
          MKDOCS_ENABLE_GIT_COMMITTERS: ${{ github.token && 'True' || 'False' }}
        run: |
          mkdocs build --strict
      - name: Upload pages as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.number || 'main' }}
          path: public/
