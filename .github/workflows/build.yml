name: Build

on: 
  push:
    branches:    
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/install-zensical.sh
            scripts/preview-requirements.txt
      - name: Install Zensical
        run: |
          scripts/install-zensical.sh
      - name: Cache GitHub users
        uses: actions/cache@v4
        with:
          path: authors.json
          # PRs can restore main's cache; each run saves newly discovered users.
          key: github-users-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-users-v1-
      - name: Restore the legacy main cache if needed
        if: hashFiles('authors.json') == ''
        uses: actions/cache/restore@v4
        with:
          path: authors.json
          key: test-push-github-users-v0.1
      - name: Test article preview publishing
        run: |
          python -m pip install -r scripts/preview-requirements.txt
          python -m unittest discover -s scripts -p 'test_*preview*.py'
      - name: Build pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          zensical build --strict
          python scripts/page_meta.py public
      - name: Upload pages as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.number || 'main' }}
          path: public/
